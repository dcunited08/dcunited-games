<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dcunited games</title>
<link rel="stylesheet" href="games/shared.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 90% 60% at 50% -10%, var(--bg-glow), var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px;
  }
  main { max-width: 1080px; margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 36px); letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .lead { color: var(--muted); margin: 6px 0 28px; }
  .grid {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .game-card {
    display: block;
    height: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    color: var(--text);
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .game-card:hover, .game-card:focus-visible {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(15, 35, 64, 0.12);
    outline: none;
  }
  .preview { display: block; aspect-ratio: 3 / 2; background: var(--preview); }
  .preview svg { display: block; width: 100%; height: 100%; }
  .body { display: block; padding: 14px 16px 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-size: 18px; font-weight: 700; }
  .tag {
    white-space: nowrap;
    font-size: 12px;
    color: var(--highlight);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .desc { display: block; color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
  .play {
    display: inline-flex;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    font-size: 14px;
  }
  .game-card:hover .play { background: var(--accent-hover); }
  .best { font-size: 13px; color: var(--muted); }
  .best b { color: var(--text); }
  @media (prefers-reduced-motion: reduce) {
    .game-card { transition: none; }
    .game-card:hover, .game-card:focus-visible { transform: none; }
  }
</style>
</head>
<body>
<main>
  <h1>dcunited <span>games</span></h1>
  <p class="lead">Games that run in the browser. No installs, just play.</p>
  <ul class="grid">
    <li>
      <a class="game-card" href="games/snake/index.html">
        <span class="preview">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <g fill="#14b8a6">
              <rect x="20" y="40" width="9" height="9" rx="2"/>
              <rect x="30" y="40" width="9" height="9" rx="2"/>
              <rect x="40" y="40" width="9" height="9" rx="2"/>
              <rect x="40" y="30" width="9" height="9" rx="2"/>
              <rect x="50" y="30" width="9" height="9" rx="2"/>
              <rect x="60" y="30" width="9" height="9" rx="2"/>
            </g>
            <rect x="70" y="30" width="9" height="9" rx="2" fill="#0f766e"/>
            <circle cx="94.5" cy="34.5" r="4.5" fill="#ef4444"/>
          </svg>
        </span>
        <span class="body">
          <span class="row"><span class="name">Snake</span><span class="tag">Arcade</span></span>
          <span class="desc">Eat, grow, and don't bite your own tail.</span>
          <span class="row">
            <span class="play">▶ Play</span>
            <span class="best" data-best-key="dcunited-games.snake.best" hidden>Best <b></b></span>
          </span>
        </span>
      </a>
    </li>
    <li>
      <a class="game-card" href="games/chickens-vs-pigs/index.html">
        <span class="preview">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <g fill="#a8794f">
              <rect x="30" y="10" width="15" height="15"/><rect x="60" y="10" width="15" height="15"/>
              <rect x="45" y="25" width="15" height="15"/><rect x="75" y="25" width="15" height="15"/>
              <rect x="30" y="40" width="15" height="15"/><rect x="60" y="40" width="15" height="15"/>
              <rect x="45" y="55" width="15" height="15"/><rect x="75" y="55" width="15" height="15"/>
            </g>
            <g fill="#f6e7bd">
              <rect x="45" y="10" width="15" height="15"/><rect x="75" y="10" width="15" height="15"/>
              <rect x="30" y="25" width="15" height="15"/><rect x="60" y="25" width="15" height="15"/>
              <rect x="45" y="40" width="15" height="15"/><rect x="75" y="40" width="15" height="15"/>
              <rect x="30" y="55" width="15" height="15"/><rect x="60" y="55" width="15" height="15"/>
            </g>
            <g>
              <circle cx="49" cy="58" r="2.6" fill="#dc2626"/><circle cx="52.5" cy="57" r="2.6" fill="#dc2626"/><circle cx="56" cy="58" r="2.6" fill="#dc2626"/>
              <circle cx="52.5" cy="62.5" r="6" fill="#ffffff" stroke="#d6d3d1"/>
              <circle cx="50.5" cy="61.5" r="0.9" fill="#1c1917"/><circle cx="54.5" cy="61.5" r="0.9" fill="#1c1917"/>
              <path d="M51 63h3l-1.5 2.4z" fill="#f59e0b"/>
            </g>
            <g>
              <path d="M63 13l-3-3 1 6zM72 13l3-3-1 6z" fill="#ec7fa6"/>
              <circle cx="67.5" cy="17.5" r="6" fill="#f9a8c4"/>
              <circle cx="65.3" cy="16" r="0.9" fill="#1c1917"/><circle cx="69.7" cy="16" r="0.9" fill="#1c1917"/>
              <ellipse cx="67.5" cy="19.5" rx="2.6" ry="1.8" fill="#ec7fa6"/>
            </g>
          </svg>
        </span>
        <span class="body">
          <span class="row"><span class="name">Chickens vs Pigs</span><span class="tag">Board game</span></span>
          <span class="desc">Checkers on the farm. Hop the pigs, crown a Rooster.</span>
          <span class="row">
            <span class="play">▶ Play</span>
            <span class="best" data-best-key="dcunited-games.chickens-vs-pigs.wins" hidden>Wins <b></b></span>
          </span>
        </span>
      </a>
    </li>
  </ul>
</main>
<script>
  // Show each game's saved best score (or win count) on its card, if there is one.
  document.querySelectorAll('[data-best-key]').forEach((el) => {
    let best = 0;
    try { best = Number(localStorage.getItem(el.dataset.bestKey)) || 0; } catch {}
    if (best > 0) {
      el.querySelector('b').textContent = best;
      el.hidden = false;
    }
  });
</script>
</body>
</html>
