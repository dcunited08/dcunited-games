<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dcunited games</title>
<style>
  :root { --bg: #10141a; --panel: #1a2029; --text: #e6edf3; --muted: #8b98a5; --accent: #4ade80; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 16px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.game {
    display: block;
    background: var(--panel);
    border-radius: 8px;
    padding: 16px;
    color: var(--text);
    text-decoration: none;
    border: 1px solid transparent;
  }
  a.game:hover, a.game:focus-visible { border-color: var(--accent); }
  a.game strong { display: block; font-size: 18px; }
  a.game span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>dcunited games</h1>
  <p class="lead">Games that run in the browser.</p>
  <ul>
    <li>
      <a class="game" href="games/snake/index.html">
        <strong>Snake</strong>
        <span>Eat, grow, and don't bite your own tail.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
