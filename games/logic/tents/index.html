<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tents and Trees</title>
<link rel="stylesheet" href="../../shared.css">
<link rel="stylesheet" href="../logic.css">
<style>
  :root {
    --grass: #d6efc9;
    --tent: #2f9e44;
    --tent-dark: #1f6f31;
    --trunk: #8a5a2b;
    --met: #15803d;
  }
  body { gap: 8px; }
  .rules { width: min(100%, 720px); margin: 0; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.35; }
  .rules b { color: var(--text); }
  .board-wrap { width: min(100%, 720px); display: flex; justify-content: center; position: relative; }
  /* The square holds the clue row on top, the clue column on the left and the board. */
  .tents {
    --n: 6;
    --size: min(100%, 720px, calc(100vh - 490px));
    --size: min(100%, 720px, calc(100dvh - 490px));
    --unit: calc(var(--size) / (var(--n) + 1));
    width: var(--size);
    min-width: min(100%, 300px);
    aspect-ratio: 1;
    container-type: inline-size;
    display: grid;
    grid-template-columns: var(--unit) 1fr;
    grid-template-rows: var(--unit) 1fr;
  }
  .col-clues { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: repeat(var(--n), 1fr); }
  .row-clues { grid-column: 1; grid-row: 2; display: grid; grid-template-rows: repeat(var(--n), 1fr); }
  .clue {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: clamp(14px, calc(50cqw / (var(--n) + 1)), 28px); line-height: 1;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .clue.met { color: var(--met); }
  .clue.over { color: var(--error-text); }
  .clue.over::after, .clue.met::after { content: none; }
  .tents .puzzle-board {
    grid-column: 2; grid-row: 2;
    width: 100%; min-width: 0; aspect-ratio: auto;
    grid-template-columns: repeat(var(--n), 1fr);
    grid-template-rows: repeat(var(--n), 1fr);
    gap: 0;
    background: var(--panel);
    touch-action: none;
    border-radius: 6px;
  }
  .cell {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 0;
    touch-action: none;
    -webkit-touch-callout: none;
  }
  .cell.grass { background: var(--grass); }
  .cell.tree { background: var(--panel); cursor: default; }
  .cell.error { background: var(--cell-error); box-shadow: inset 0 0 0 3px var(--error-text); }
  .cell.drag { box-shadow: inset 0 0 0 3px var(--accent); }
  .cell.hinted { animation: hintpulse 1.2s ease-out; }
  .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
  .cell svg { width: 82%; height: 82%; display: none; pointer-events: none; }
  .cell.tree svg.tree-art, .cell.tent svg.tent-art, .cell.grass svg.grass-art { display: block; }
  .tent-art .body { fill: var(--tent); stroke: var(--tent-dark); }
  .cell.error .tent-art .body { fill: var(--error-text); stroke: #7f1d1d; }
  .tent-art .door { fill: var(--tent-dark); }
  .grass-art path { stroke: #4d9a3b; fill: none; stroke-width: 3; stroke-linecap: round; }
  @keyframes hintpulse { 0% { box-shadow: inset 0 0 0 5px var(--accent); transform: scale(1.12); } 100% { box-shadow: inset 0 0 0 0 transparent; transform: none; } }
  .puzzle-board.locked .cell { cursor: default; }
  .info { width: min(100%, 720px); display: flex; justify-content: space-between; gap: 12px; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .info b { color: var(--text); }
  .message { min-height: 1.5em; }
  .picker { gap: 8px; }
  .puzzle-list { gap: 6px; }
  /* Covers the board when solved, so the page does not grow. */
  .solved-panel {
    position: absolute; inset: 0; margin: auto; width: min(86%, 420px); height: fit-content;
    text-align: center; padding: 16px; border-radius: 14px;
    background: var(--panel); border: 2px solid var(--accent); box-shadow: 0 8px 30px rgba(15, 35, 64, 0.35);
    display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 5;
  }
  .solved-panel[hidden] { display: none; }
  .solved-panel h2 { margin: 0; font-size: 26px; }
  .solved-panel .stars { font-size: 34px; letter-spacing: 6px; color: #d99a06; }
  .solved-panel .stars span { display: inline-block; animation: pop 0.8s ease-out both; }
  .solved-panel .stars span:nth-child(2) { animation-delay: 0.12s; }
  .solved-panel .stars span:nth-child(3) { animation-delay: 0.24s; }
  @keyframes pop { 0% { transform: scale(0) rotate(-90deg); opacity: 0; } 70% { transform: scale(1.4) rotate(15deg); opacity: 1; } 100% { transform: none; } }
  .cell.tent.win svg { animation: winhop 0.9s ease-out both; }
  @keyframes winhop { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-8deg); } 100% { transform: scale(1); } }
  .primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .primary:hover { background: var(--accent-hover); }
  .picker-wrap { width: min(100%, 720px); }
  @media (prefers-reduced-motion: reduce) {
    .cell.hinted, .solved-panel .stars span, .cell.tent.win svg { animation: none; }
  }
  /* Phone: use the full width for the board and let the controls scroll below it. */
  @media (max-width: 600px) {
    .tents { --size: 100%; }
  }
  /* Wide and short (iPad landscape): board on the left, everything else in a column on the right. */
  @media (min-aspect-ratio: 11/10) and (max-height: 900px) {
    body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); grid-auto-rows: min-content; align-content: start; column-gap: 20px; row-gap: 8px; align-items: start; }
    body > * { grid-column: 2; width: 100%; }
    body > .board-wrap { grid-column: 1; grid-row: 1 / span 9; width: 100%; align-self: start; }
    .tents { --size: min(calc(100vw - 460px), 720px, calc(100vh - 40px)); --size: min(calc(100vw - 460px), 720px, calc(100dvh - 40px)); }
    h1 { font-size: 24px; text-align: left; }
    .rules { text-align: left; }
    .crumbs { width: 100%; }
  }
</style>
</head>
<body>
<nav class="crumbs">
  <a class="back-link" href="../index.html">← Logic puzzles</a>
  <a class="home-link" href="../../../index.html">All games</a>
</nav>
<h1>Tents and Trees</h1>
<p class="rules">Give every tree its own tent, right beside it (up, down, left or right). Tents never touch, not even at the corners. The numbers count the tents in each row and column.<br><b>Tap:</b> grass, tap again: tent. Drag to add grass.</p>
<div class="info"><span id="label"></span><span>Time <b id="time">0:00</b></span></div>
<div class="board-wrap">
  <div class="tents" id="tents">
    <div class="col-clues" id="colClues" aria-hidden="true"></div>
    <div class="row-clues" id="rowClues" aria-hidden="true"></div>
    <div id="board" class="puzzle-board" role="grid" aria-label="Tents and Trees board"></div>
  </div>
  <div class="solved-panel" id="solved" hidden>
    <div class="stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
    <h2 id="solvedText">Solved!</h2>
    <button type="button" class="tool primary" id="nextBtn">Next puzzle</button>
  </div>
</div>
<div class="status message" id="message" aria-live="polite"></div>
<div class="toolbar">
  <button type="button" class="tool" id="undoBtn">Undo</button>
  <button type="button" class="tool" id="restartBtn">Restart</button>
  <button type="button" class="tool" id="checkBtn">Check</button>
  <button type="button" class="tool" id="hintBtn">Hint</button>
  <button type="button" class="tool" id="newBtn">New puzzle</button>
</div>
<div class="picker-wrap" id="picker"></div>

<script src="../kit.js"></script>
<script src="../picker.js"></script>
<script src="logic.js"></script>
<script src="solver.js"></script>
<script src="puzzles.js"></script>
<script src="game.js"></script>
<script>
(function () {
  const Kit = LogicKit, Game = TentsGame, Logic = TentsLogic, Puzzles = TentsPuzzles;
  const LEVEL_NAMES = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const counts = { easy: Puzzles.easy.length, medium: Puzzles.medium.length, hard: Puzzles.hard.length };
  const progress = Kit.createProgress('tents');
  const $ = (id) => document.getElementById(id);
  const boardEl = $('board'), timeEl = $('time'), msgEl = $('message'), solvedEl = $('solved');
  const SVG = 'http://www.w3.org/2000/svg';

  let id = null, puzzle = null, game = null, timer = null, cellEls = [], rowEls = [], colEls = [];
  let marks = new Set();          // cells flagged by Check, until the next move
  let hinted = -1, solvedNow = false, drag = null;

  const rowCol = (i) => [Math.floor(i / puzzle.size), i % puzzle.size];
  const labelFor = (st) => (st === 'tent' ? 'tent' : st === 'grass' ? 'grass' : 'empty');

  function svg(markup) {
    const s = document.createElementNS(SVG, 'svg');
    s.setAttribute('viewBox', '0 0 40 40');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = markup;
    return s;
  }
  const treeArt = () => {
    const s = svg('<rect x="17" y="26" width="6" height="11" rx="1.5" fill="#8a5a2b"/><circle cx="20" cy="16" r="12" fill="#2b8a3e"/><circle cx="15" cy="13" r="4" fill="#51b36a" opacity="0.8"/>');
    s.setAttribute('class', 'tree-art');
    return s;
  };
  const tentArt = () => {
    const s = svg('<path class="body" d="M20 5 L37 34 H3 Z" stroke-width="2" stroke-linejoin="round"/><path class="door" d="M20 17 L27 34 H13 Z"/>');
    s.setAttribute('class', 'tent-art');
    return s;
  };
  const grassArt = () => {
    const s = svg('<path d="M12 30 Q12 22 9 17 M20 31 Q20 20 20 14 M28 30 Q28 22 31 17"/>');
    s.setAttribute('class', 'grass-art');
    return s;
  };

  function buildBoard() {
    const n = puzzle.size;
    $('tents').style.setProperty('--n', n);
    boardEl.style.setProperty('--n', n);
    boardEl.replaceChildren();
    cellEls = [];
    for (let i = 0; i < n * n; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.dataset.i = i;
      b.setAttribute('role', 'gridcell');
      if (puzzle.trees[i]) {
        b.classList.add('tree');
        b.tabIndex = -1;
        b.append(treeArt());
      } else {
        b.append(grassArt(), tentArt());
      }
      boardEl.append(b);
      cellEls.push(b);
    }
    const clueEl = (num) => { const d = document.createElement('div'); d.className = 'clue'; d.textContent = num; return d; };
    rowEls = puzzle.rows.map(clueEl);
    colEls = puzzle.cols.map(clueEl);
    $('rowClues').replaceChildren(...rowEls);
    $('colClues').replaceChildren(...colEls);
  }

  function render() {
    const st = game.state();
    const bad = new Set(game.conflicts());
    marks.forEach((i) => bad.add(i));
    const solved = game.isSolved();
    const lines = game.lineStatus();
    st.cells.forEach((v, i) => {
      const el = cellEls[i];
      const [r, c] = rowCol(i);
      const tree = puzzle.trees[i];
      el.classList.toggle('tent', v === 'tent');
      el.classList.toggle('grass', v === 'grass');
      el.classList.toggle('error', bad.has(i));
      el.classList.toggle('win', solved && v === 'tent');
      el.classList.toggle('hinted', i === hinted);
      el.setAttribute('aria-label', tree ? `Row ${r + 1}, column ${c + 1}, tree` : `Row ${r + 1}, column ${c + 1}, ${labelFor(v)}`);
    });
    const paint = (els, list) => els.forEach((el, k) => {
      el.classList.toggle('met', list[k] === 'met');
      el.classList.toggle('over', list[k] === 'over');
    });
    paint(rowEls, lines.rows);
    paint(colEls, lines.cols);
    $('undoBtn').disabled = solved || !game.canUndo();
    ['restartBtn', 'checkBtn', 'hintBtn'].forEach((b) => { $(b).disabled = solved; });
    boardEl.classList.toggle('locked', solved);
    boardEl.setAttribute('aria-readonly', String(solved));
  }

  function say(text) { msgEl.textContent = text || ''; }
  function tickTime() { timeEl.textContent = Kit.formatTime(timer.elapsed(Date.now())); }

  function persist() {
    if (!id || solvedNow) return;
    progress.save(id, Game.buildSave(game.state(), timer.elapsed(Date.now())));
  }

  function afterMove() {
    marks = new Set();
    hinted = -1;
    say('');
    render();
    if (game.isSolved()) return finish();
    persist();
  }

  function finish() {
    solvedNow = true;
    timer.pause(Date.now());
    tickTime();
    progress.markSolved(id);
    progress.clearSave(id);
    $('solvedText').textContent = `Solved! in ${Kit.formatTime(timer.elapsed(Date.now()))}`;
    solvedEl.hidden = false;
    renderPicker();
    render();
  }

  function renderPicker() {
    LogicPicker.render($('picker'), { counts, isSolved: progress.isSolved, current: id, onPick: open });
  }

  function open(newId) {
    const p = Kit.parsePuzzleId(newId);
    if (!p || p.n > counts[p.level]) newId = Kit.nextUnsolved(counts, progress.isSolved, 'easy') || 'easy-1';
    const parsed = Kit.parsePuzzleId(newId);
    id = newId;
    puzzle = Logic.parsePuzzle(Puzzles[parsed.level][parsed.n - 1]);
    solvedNow = false;
    marks = new Set();
    hinted = -1;
    drag = null;
    solvedEl.hidden = true;
    let start = null, elapsed = 0;
    if (!progress.isSolved(id)) {
      const restored = Game.restoreSave(puzzle, progress.loadSave(id));
      if (restored) { start = restored.state; elapsed = restored.elapsedMs; }
    }
    game = Game.createGame(puzzle, start);
    timer = Game.createTimer(elapsed);
    progress.setLastPlayed(id);
    $('label').textContent = `${LEVEL_NAMES[parsed.level]} · Puzzle ${parsed.n}`;
    say('');
    buildBoard();
    renderPicker();
    render();
    if (game.isSolved()) return finish();
    timer.start(Date.now());
    tickTime();
  }

  // Input: pointer events on the board. A tap cycles a cell; moving onto other
  // cells while down is a drag that marks every empty cell passed over as grass.
  function cellAt(x, y) {
    const e = document.elementFromPoint(x, y);
    const b = e && e.closest ? e.closest('.cell') : null;
    return b && boardEl.contains(b) ? Number(b.dataset.i) : -1;
  }
  function markDrag() {
    cellEls.forEach((el, i) => el.classList.toggle('drag', !!drag && drag.dragging && drag.path.has(i) && !puzzle.trees[i]));
  }
  boardEl.addEventListener('pointerdown', (e) => {
    if (game.isSolved() || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const i = cellAt(e.clientX, e.clientY);
    if (i < 0) return;
    e.preventDefault();
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    drag = { start: i, path: new Set([i]), dragging: false, pointerId: e.pointerId };
  });
  boardEl.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const i = cellAt(e.clientX, e.clientY);
    if (i < 0 || drag.path.has(i)) return;
    drag.path.add(i);
    drag.dragging = true;
    markDrag();
  });
  function endPointer(e, cancelled) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const d = drag;
    drag = null;
    markDrag();
    if (cancelled) return;
    if (d.dragging) {
      if (game.dragGrass([...d.path].map(rowCol))) afterMove();
    } else {
      const [r, c] = rowCol(d.start);
      if (game.tap(r, c)) afterMove();
    }
  }
  boardEl.addEventListener('pointerup', (e) => endPointer(e, false));
  boardEl.addEventListener('pointercancel', (e) => endPointer(e, true));
  boardEl.addEventListener('contextmenu', (e) => e.preventDefault());
  // Keyboard (Enter/Space) arrives as a click with no pointer: detail is 0.
  boardEl.addEventListener('click', (e) => {
    if (e.detail !== 0) return;
    const b = e.target.closest('.cell');
    if (!b) return;
    const [r, c] = rowCol(Number(b.dataset.i));
    if (game.tap(r, c)) afterMove();
  });

  $('undoBtn').addEventListener('click', () => { if (game.undo()) afterMove(); });
  $('restartBtn').addEventListener('click', () => {
    game.clear();
    timer.reset();
    timer.start(Date.now());
    tickTime();
    afterMove();
  });
  $('checkBtn').addEventListener('click', () => {
    const bad = game.mistakes();
    marks = new Set(bad);
    hinted = -1;
    render();
    say(bad.length ? `${bad.length} ${bad.length === 1 ? 'mistake' : 'mistakes'}` : 'No mistakes so far');
  });
  $('hintBtn').addEventListener('click', () => {
    const h = game.applyHint();
    if (!h) return;
    afterMove();
    hinted = h.r * puzzle.size + h.c;
    render();
    say(h.reason);
  });
  function goNext() { open(Game.nextPuzzleId(counts, progress.isSolved, id)); }
  $('nextBtn').addEventListener('click', goNext);
  $('newBtn').addEventListener('click', goNext);

  document.addEventListener('visibilitychange', () => {
    if (!timer || solvedNow) return;
    if (document.hidden) { timer.pause(Date.now()); persist(); } else { timer.start(Date.now()); }
  });
  window.addEventListener('pagehide', () => { if (timer && !solvedNow) { timer.pause(Date.now()); persist(); } });
  setInterval(() => { if (timer) tickTime(); }, 500);

  open(progress.lastPlayed() || Kit.nextUnsolved(counts, progress.isSolved, 'easy') || 'easy-1');
}());
</script>
</body>
</html>
