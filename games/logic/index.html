<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic puzzles</title>
<link rel="stylesheet" href="../shared.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 90% 60% at 50% -10%, var(--bg-glow), var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px;
  }
  .game-nav { margin-bottom: 20px; }
  main { max-width: 1080px; margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 36px); letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .lead { color: var(--muted); margin: 6px 0 28px; }
  .grid {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .game-card {
    display: block;
    height: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    color: var(--text);
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .game-card:hover, .game-card:focus-visible {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(15, 35, 64, 0.12);
    outline: none;
  }
  .preview { display: block; aspect-ratio: 3 / 2; background: var(--preview); }
  .preview svg { display: block; width: 100%; height: 100%; }
  .body { display: block; padding: 14px 16px 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-size: 18px; font-weight: 700; }
  .tag {
    white-space: nowrap;
    font-size: 12px;
    color: var(--highlight);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .desc { display: block; color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
  .play {
    display: inline-flex;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    font-size: 14px;
  }
  .game-card:hover .play { background: var(--accent-hover); }
  .best { font-size: 13px; color: var(--muted); }
  .best b { color: var(--text); }
  @media (prefers-reduced-motion: reduce) {
    .game-card { transition: none; }
    .game-card:hover, .game-card:focus-visible { transform: none; }
  }
  .empty { color: var(--muted); font-size: 18px; margin: 12px 0; }
  .grid:not(:empty) + .empty { display: none; }
</style>
</head>
<body>
<main>
  <nav class="game-nav"><a class="back-link" href="../../index.html">← All games</a></nav>
  <h1>Logic <span>puzzles</span></h1>
  <p class="lead">Puzzles that need no luck, just thinking.</p>
  <ul class="grid">
  <li>
    <a class="game-card" href="killer-sudoku/index.html">
      <span class="preview"><svg viewBox="0 0 120 80" aria-hidden="true">
        <rect x="24" y="4" width="72" height="72" rx="4" fill="#fff" stroke="#0f2340" stroke-width="2"/>
        <g stroke="#d6e4f5" stroke-width="1"><path d="M48 4v72M72 4v72M24 28h72M24 52h72"/></g>
        <path d="M48 4v72M72 4v72M24 28h72M24 52h72" stroke="#0f2340" stroke-width="0.6" opacity="0.35"/>
        <rect x="28" y="8" width="40" height="16" rx="1" fill="none" stroke="#0369a1" stroke-width="1.6" stroke-dasharray="3 2.4"/>
        <text x="30" y="16" font-size="6" font-weight="700" fill="#0f2340" font-family="system-ui, sans-serif">12</text>
        <g font-family="system-ui, sans-serif" font-size="13" fill="#0f2340" text-anchor="middle">
          <text x="58" y="22">7</text><text x="36" y="49">5</text><text x="84" y="49">3</text>
        </g>
        <g font-family="system-ui, sans-serif" font-size="6" fill="#53698a" text-anchor="middle"><text x="79" y="12">1 4</text><text x="43" y="64">2 9</text></g>
      </svg></span>
      <span class="body">
        <span class="row"><span class="name">Killer Sudoku</span><span class="tag">Numbers</span></span>
        <span class="desc">Sudoku where dotted cages must add up to their sum.</span>
        <span class="row">
          <span class="play">▶ Play</span>
          <span class="best" data-best-key="dcunited-games.logic.killer-sudoku.solved" hidden>Solved <b></b></span>
        </span>
      </span>
    </a>
  </li>
  </ul>
  <p class="empty">New puzzles are on the way.</p>
</main>
<script>
  // Show each game's saved best score (or win count) on its card, if there is one.
  document.querySelectorAll('[data-best-key]').forEach((el) => {
    let best = 0;
    try { best = Number(localStorage.getItem(el.dataset.bestKey)) || 0; } catch {}
    if (best > 0) {
      el.querySelector('b').textContent = best;
      el.hidden = false;
    }
  });
</script>
</body>
</html>
